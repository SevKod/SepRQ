[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seprq"
version = "0.1.3"
description = "SSL speech feature extractors (SepRQ & BEST-RQ 50 Hz) tailor-made for cocktail-party speech; returns the 12 Conformer layer features."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SevKod" }]
dependencies = [
    "speechbrain>=1.0.3",
    "hyperpyyaml",
    "huggingface_hub",
    "torch",
    "soundfile",
]

[project.urls]
Homepage = "https://huggingface.co/SevKod/SepRQ"

[tool.setuptools.packages.find]
where = ["src"]
